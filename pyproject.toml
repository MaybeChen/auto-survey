[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-survey-ai"
version = "0.1.0"
description = "Cross-platform network capture API survey agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "openapi-spec-validator>=0.7,<0.8"]

[project.scripts]
api-survey = "src.cli:main"
api-survey-capture = "src.capture_service:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.sql" = ["schema.sql"]
